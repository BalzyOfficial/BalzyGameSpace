name: BalzyGameSpace - Extract ZIP & Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "BalzyGameSpace-source.zip"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q BalzyGameSpace-source.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Debug APK
        working-directory: extracted
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BalzyGameSpace-debug
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
